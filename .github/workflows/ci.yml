name: security

# The same gate as the local pre-commit hook, enforced on every push and pull request
# so no commit lands on GitHub without passing it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Supply-chain + fuzz gate (offline). Runs more fuzz iterations than the pre-commit hook.
      - name: Security gate (supply-chain + fuzz)
        run: bash scripts/security-check.sh
        env:
          FUZZ_ITERATIONS: "40000"
          FUZZ_SECONDS: "90"

      # Known-vulnerability scan against the pinned locks (needs network, so CI-only).
      - name: Known-vulnerability scan (pip-audit)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r agent/requirements.lock
          pip-audit -r ghidra/requirements.lock
